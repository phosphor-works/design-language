#
# Pull request and main CI. The jobs (Arch, Lint) are the shared C++ CI of the
# workspace repository (.github/workflows/cpp-ci.yml), which says what each one
# does. This file passes only what differs here.
#
# The standalone preset uses only Qt. Its tests render each story in the two
# schemes and check the text. No job builds the phosphor libraries and their
# stories (the dev preset). There is no flake, so the Nix jobs are off.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    uses: phosphor-works/workspace/.github/workflows/cpp-ci.yml@v1
    with:
      pin-file: cmake/DesignDependencies.cmake
      preset: standalone
      build-timeout: 30
      nix: false
